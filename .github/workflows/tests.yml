name: tests 

on:
  push:
    branches:
      - '**' 

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true  # Speeds up subsequent runs by caching dependencies

      - name: Set up Python
        run: uv python install 3.14  # Replace with your desired Python version

      - name: Install dependencies
        run: uv sync --locked --dev  # Ensures uv.lock matches your pyproject.toml

      - name: Run pytest
        run: uv run pytest

