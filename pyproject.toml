[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostman"
version = "0.1.5"
description = "A fast, keyboard-driven terminal API client and webhook inspector"
readme = "README.md"
authors = [{ name = "4yk5" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["api", "tui", "terminal", "webhook", "postman", "rest", "http"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "textual>=8.0.0",
    "httpx>=0.28.0",
    "rich>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/4yk5/Ghostman"
Repository = "https://github.com/4yk5/Ghostman"
Issues = "https://github.com/4yk5/Ghostman/issues"

[project.scripts]
ghostman = "main:main"

[tool.setuptools.package-data]
"*" = ["styles.tcss"]

[tool.setuptools]
py-modules = ["app", "main", "network", "storage", "webhook_server"]
